name: SensiboToggle
options:
  bundleIdPrefix: com.a
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_TESTABILITY: "YES"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"

targets:
  SensiboToggle:
    type: application
    platform: iOS
    sources:
      - path: Sources/ACController.swift
      - path: Sources/BedroomOneWidgetSupport.swift
      - path: Sources/Config.swift
      - path: Sources/ContentView.swift
      - path: Sources/MockSensiboClient.swift
      - path: Sources/Models.swift
      - path: Sources/SensiboClient.swift
      - path: Sources/SensiboToggleApp.swift
      - path: Sources/Assets.xcassets
        buildPhase: resources
      - path: config/local.config.json
        buildPhase: resources
    dependencies:
      - target: BedroomOneWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a.SensiboToggle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    info:
      path: Sources/Info.plist

  SensiboToggleMenuBar:
    type: application
    platform: macOS
    sources:
      # Shared, platform-agnostic core — identical behaviour to the app.
      - path: Sources/ACController.swift
      - path: Sources/Config.swift
      - path: Sources/Models.swift
      - path: Sources/MockSensiboClient.swift
      - path: Sources/SensiboClient.swift
      # Menu-bar entry point (macOS-only: MenuBarExtra). Not the iOS @main.
      - path: Sources/MenuBar/SensiboMenuBarApp.swift
      - path: Sources/MenuBar/SensiboMenuBarView.swift
      - path: config/local.config.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.a.SensiboToggle.MenuBar
        PRODUCT_NAME: SensiboMenuBar
        # Hand-maintained plist carrying LSUIElement; keep xcodegen from
        # clobbering it (omit the `info:` key, like the widget plist).
        INFOPLIST_FILE: MenuBar/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"

  BedroomOneWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BedroomOneWidget/BedroomOneWidget.swift
      - path: Sources/BedroomOneWidgetSupport.swift
      - path: config/local.config.json
        buildPhase: resources
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.a.SensiboToggle.BedroomOneWidget
        SKIP_INSTALL: "YES"
        SWIFT_VERSION: "5.0"
        # Hand-maintained widget plist (carries NSExtension /
        # com.apple.widgetkit-extension). Protect it from xcodegen the same
        # way as the menu-bar plist — point at it and never generate it.
        INFOPLIST_FILE: BedroomOneWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"

  SensiboTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit/BackoffPolicyTests.swift
      - path: Tests/Unit/ControllerTests.swift
      - path: Tests/Unit/ModelAndConfigTests.swift
      - path: Tests/Unit/SensiboIntegrationTests.swift
      - path: config/local.config.json
        buildPhase: resources
    dependencies:
      - target: SensiboToggle

  SensiboUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI/SensiboUITests.swift
    dependencies:
      - target: SensiboToggle

schemes:
  SensiboToggle:
    build:
      targets:
        SensiboToggle: all
        BedroomOneWidgetExtension: all
        SensiboTests: [test]
        SensiboUITests: [test]
    run:
      targets:
        - SensiboToggle
    test:
      targets:
        - SensiboTests
        - SensiboUITests

  SensiboToggleMenuBar:
    build:
      targets:
        SensiboToggleMenuBar: all
    run:
      targets:
        - SensiboToggleMenuBar
